<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wakes prévus</title><style>:root {
  color-scheme: light dark;
  --bg: #fbfaf8;
  --fg: #1c1b19;
  --muted: #5f5b55;
  --line: #e2ded8;
  --active: #1f6f4a;
  --idle: #35577d;
  --attention: #8a5a00;
  --stopped: #9b1c1c;
  --unknown: #5f5b55;
  font:
    14px/1.45 "Segoe UI Variable",
    "Segoe UI",
    system-ui,
    sans-serif;
}

.wake-plan-summary { margin:0 0 14px; font-size:13px; color:var(--muted); }
.project-badge { display:inline-flex; align-items:center; justify-content:center; flex:none; width:22px; height:22px; border-radius:5px; background:var(--project-color); color:#243447; font-size:12px; font-weight:700; line-height:1; vertical-align:middle; }
.objective-undefined-badge { display:inline-block; flex:none; padding:2px 6px; border:1px dashed currentColor; border-radius:5px; color:var(--attention); background:var(--bg); font-size:10px; font-weight:600; line-height:1.4; vertical-align:middle; }
.project-legend { display:flex; flex-wrap:wrap; gap:8px 16px; margin:12px 0; }
.project-legend-item { display:inline-flex; align-items:center; gap:6px; font-size:11px; }
#chat li.project-objective { border-left:3px solid var(--project-color); }
#chat .project-plan-row { display:flex; align-items:baseline; gap:7px; margin:5px 0; }
.wake-plan-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:16px; }
#view-panel>.wake-plan-section { color-scheme:light; --bg:#fbfcff; --fg:#243447; --muted:#68798e; --line:#e5ebf3; color:var(--fg); background:#fff; box-shadow:0 6px 24px #29415f06; }
.wake-stat { text-align:left; display:flex; flex-direction:column; gap:5px; padding:12px 9px; background:color-mix(in srgb,var(--wake-color) 15%,white); border:1px solid var(--line); border-top:3px solid var(--wake-color); border-radius:11px; min-width:0; color:var(--fg); }
[data-wake-type="prepare"] { --wake-color:#91b4f4; }
[data-wake-type="work"] { --wake-color:#83d5bf; }
[data-wake-type="free"] { --wake-color:#f0c17d; }
.wake-stat[aria-pressed="true"] { outline:2px solid var(--wake-color); outline-offset:1px; }
.wake-stat-label { font-size:11px; line-height:1.3; }
.wake-stat-count { font-size:26px; font-weight:650; line-height:1.2; }
.wake-stat-share { font-size:10px; color:var(--muted); }
.wake-plan-hint,.wake-plan-footnote { font-size:11px; line-height:1.5; color:var(--muted); margin:10px 0; }
.wake-plan-days { display:flex; flex-direction:column; gap:16px; margin:16px 0; max-height:480px; overflow-y:auto; padding:4px; scrollbar-gutter:stable; }
.wake-plan-day { display:grid; grid-template-columns:28px minmax(0,1fr); gap:8px; align-items:start; }
.wake-plan-day-label { font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
.wake-plan-grid { display:flex; flex-direction:column; gap:5px; min-width:0; }
button.wake-band { display:flex; flex-wrap:wrap; align-items:center; gap:8px; width:100%; min-width:0; min-height:38px; padding:7px 10px; margin:0; border:0; border-radius:6px; background:var(--project-color); color:#243447; text-align:left; font-size:12px; font-weight:600; line-height:1.4; cursor:pointer; transition:opacity .15s; }
button.wake-band:hover { filter:brightness(.96); }
.wake-band-project { flex:1 1 140px; min-width:0; overflow-wrap:anywhere; }
.wake-band-number,.wake-band-state { flex:none; font-size:10px; }
.wake-band-state { border:1px solid currentColor; padding:1px 5px; border-radius:4px; }
button.wake-band[data-objective-defined="false"] { position:relative; background-image:repeating-linear-gradient(135deg,transparent 0 4px,#ffffff40 4px 6px); }
button.wake-band[aria-pressed="true"],button.wake-band:focus-visible { outline:2px solid var(--fg); outline-offset:1px; }
button.wake-band[data-state="running"] { box-shadow:inset 0 0 0 2px var(--fg); }
button.wake-band.wake-band-muted { opacity:.18; }
.wake-plan-detail { border:1px solid var(--line); border-left:3px solid var(--project-color,var(--idle)); background:var(--bg); border-radius:8px; padding:12px; overflow-wrap:anywhere; }
.wake-plan-detail-meta { font-size:10px; color:var(--muted); margin-bottom:5px; }
.wake-plan-detail-project { font-size:13px; }
.wake-plan-detail-objective { font-size:12px; margin:6px 0 0; }
#chat li[data-from="plan"] { max-width:100%; background:var(--bg); border:1px solid var(--border); }
#chat li[data-from="plan"] .conversation-body > p { white-space:pre-wrap; line-height:1.8; font-size:12px; }
.wake-plan-detail-expected { font-size:11px; color:var(--muted); margin:6px 0 0; }
@media (prefers-reduced-motion:reduce) { button.wake-band { transition:none; } }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1a18;
    --fg: #f1efeb;
    --muted: #a8a39b;
    --line: #34322e;
    --active: #6fcf9c;
    --idle: #8db4e0;
    --attention: #e7b45a;
    --stopped: #f08a8a;
    --unknown: #a8a39b;
  }
}

/* `hidden` doit l'emporter sur les `display` des classes (badge SIMULÉ, sections vides). */
[hidden] {
  display: none !important;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
}

main {
  padding: 16px;
}

header {
  border-left: 4px solid var(--unknown);
  padding-left: 12px;
  margin-bottom: 16px;
}

/* L'état se lit par son libellé ; la couleur ne fait que le doubler (W06). */
header[data-tone="active"] {
  border-color: var(--active);
}
header[data-tone="idle"] {
  border-color: var(--idle);
}
header[data-tone="attention"] {
  border-color: var(--attention);
}
header[data-tone="stopped"] {
  border-color: var(--stopped);
}

.eyebrow {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

h1 {
  margin: 2px 0 4px;
  font-size: 20px;
}

h2 {
  margin: 0 0 6px;
  font-size: 13px;
  color: var(--muted);
}

#reason {
  margin: 0;
}

.badge {
  display: inline-block;
  margin: 8px 0 0;
  padding: 2px 8px;
  border: 1px solid var(--attention);
  border-radius: 4px;
  color: var(--attention);
  font-size: 12px;
  font-weight: 600;
}

section {
  border-top: 1px solid var(--line);
  padding: 10px 0;
}

dl {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 4px 12px;
  margin: 0;
}

dt {
  color: var(--muted);
}

dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  font: inherit;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
}

button:focus-visible {
  outline: 2px solid var(--idle);
  outline-offset: 2px;
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

button.danger {
  border-color: var(--stopped);
  color: var(--stopped);
  font-weight: 600;
}

button.danger[data-armed="true"] {
  background: var(--stopped);
  color: var(--bg);
}

#feedback {
  min-height: 1.4em;
  margin: 4px 0 0;
  color: var(--muted);
}

footer {
  border-top: 1px solid var(--line);
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}

footer p {
  margin: 6px 0 0;
}

/* --- Voyant, sélecteur, graphe, fils ------------------------------------------------ */

.light {
  display: inline-block;
  width: 12px;
  height: 12px;
  margin-right: 8px;
  border-radius: 50%;
  vertical-align: middle;
  background: var(--unknown);
}
.light[data-light="awake"] {
  background: var(--idle);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--idle) 25%, transparent);
}
.light[data-light="on"] {
  background: var(--active);
}
.light[data-light="off"] {
  background: var(--attention);
}
.light[data-light="forced_off"] {
  background: var(--stopped);
}

.tabs {
  flex-wrap: wrap;
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.tabs button {
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
}
.tabs button[aria-selected="true"] {
  border-bottom-color: var(--idle);
  font-weight: 600;
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-left: 4px;
  border-radius: 50%;
  vertical-align: middle;
  background: var(--idle);
}
.count {
  display: inline-block;
  min-width: 1.4em;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--idle);
  color: var(--bg);
  font-size: 11px;
  text-align: center;
}

.switch-section {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.switch button {
  border: none;
  border-radius: 0;
  border-right: 1px solid var(--line);
}
.switch button:last-child {
  border-right: none;
}
.switch button[aria-pressed="true"] {
  background: var(--fg);
  color: var(--bg);
  font-weight: 600;
}
.switch button.danger[aria-pressed="true"],
.switch button.danger[data-armed="true"] {
  background: var(--stopped);
  color: var(--bg);
}
.hint {
  flex-basis: 100%;
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.chart svg {
  display: block;
  width: 100%;
  height: auto;
}
.chart .axis {
  stroke: var(--line);
  stroke-width: 1;
}
.chart .tick {
  fill: var(--muted);
  font-size: 9px;
  text-anchor: middle;
}
.chart .bar {
  fill: var(--active);
}
.chart .bar.simulated {
  fill: var(--attention);
}
.chart .bar.unknown {
  fill: var(--line);
}
.chart .wake {
  fill: var(--idle);
  stroke: var(--bg);
  stroke-width: 1.5;
}

.threads {
  list-style: none;
  margin: 0;
  padding: 0;
}
.threads button {
  display: grid;
  gap: 2px;
  width: 100%;
  margin-bottom: 6px;
  text-align: left;
}
.threads button[data-unread="true"] strong::before {
  content: "● ";
  color: var(--idle);
}
.threads span,
.threads small {
  color: var(--muted);
  overflow-wrap: anywhere;
}
.messages {
  list-style: none;
  margin: 8px 0;
  padding: 0;
}
.messages li {
  margin-bottom: 8px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  max-width: 88%;
}
/* Réponse d'une session réveillée pour aider l'agent : distincte de l'agent et de l'humain. */
.messages li[data-from="session"] {
  border-style: dashed;
  background: color-mix(in srgb, var(--attention) 8%, transparent);
}
.messages li[data-self="true"] {
  margin-left: auto;
  background: color-mix(in srgb, var(--idle) 12%, transparent);
}
.messages p {
  margin: 4px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
#reply-form,
#chat-form {
  display: grid;
  gap: 6px;
}
textarea {
  font: inherit;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--fg);
}
.link {
  border: none;
  padding: 0;
  color: var(--idle);
}

/* Full last message in the thread list, including its paragraph breaks. */
.threads button {
  gap: 8px;
}
.threads .thread-preview {
  white-space: pre-wrap;
  color: inherit;
  font-weight: 400;
}

/* Four modes remain readable in the narrow Windows panel. */
.delivery-receipt { white-space: nowrap; font-weight: 700; }
.message-wait { display: block; margin-top: .35rem; opacity: .75; }
.delivery-receipt[data-delivered="true"] { color: var(--idle); }
#wake-history-messages li { max-width: 100%; }
#wake-history-messages li[data-from="prompt"] { border-color: var(--wake-instructions); }
.repo-pointers { white-space: pre-wrap; overflow-wrap: anywhere; }
#agent-thread-messages li { max-width: 96%; }

.switch {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  width: 100%;
}
.switch button {
  padding: 8px 6px;
  font-size: 13px;
  white-space: normal;
}

/* Workspace layout: fixed navigation, independent reading panes, persistent composer. */
:root { --bg:#f7f8f6; --surface:#fff; --nav:#eef1ec; --fg:#1e2b26; --muted:#68766d; --line:#dfe5df; --idle:#23745c; --active:#23745c; font-size:14px; }
@media(prefers-color-scheme:dark) { :root { --bg:#111a18; --surface:#17231f; --nav:#0d1512; --fg:#e4eee6; --muted:#93a79a; --line:#2a3a31; --idle:#8bd9b4; --active:#8bd9b4; } }
* { box-sizing:border-box; }
html,body { height:100%; overflow:hidden; }
main { height:100dvh; display:grid; grid-template-columns:190px minmax(0,1fr); grid-template-rows:68px minmax(0,1fr); padding:0; }
.app-brand { grid-column:1/-1; display:flex; gap:12px; align-items:center; padding:0 26px; border-bottom:1px solid var(--line); background:var(--surface); }
.app-brand strong { font-size:17px; letter-spacing:.03em; }
.app-brand strong span { color:var(--muted); font-weight:400; }
.brand-symbol { display:grid; place-items:center; width:32px; height:32px; background:var(--idle); color:var(--surface); border-radius:10px; font-size:25px; font-weight:700; font-family:Georgia,serif; }
.app-status { margin-left:auto; font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
.app-status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--muted); }
.app-status[data-tone="active"]::before { background:var(--active); box-shadow:0 0 0 4px color-mix(in srgb,var(--active) 12%,transparent); }
.tabs { grid-column:1; grid-row:2; display:flex; flex-direction:column; align-items:stretch; flex-wrap:nowrap; gap:6px; margin:0; padding:24px 12px; border:0; border-right:1px solid var(--line); background:var(--nav); }
.tabs button { flex:none; display:flex; align-items:center; gap:8px; text-align:left; border:0; border-radius:9px; padding:11px 12px; color:var(--muted); font-size:13px; }
.tabs button[aria-selected="true"] { color:var(--fg); background:var(--surface); box-shadow:0 1px 4px #00000008; }
.tabs button:hover { background:color-mix(in srgb,var(--surface) 70%,transparent); }
main>[role="tabpanel"] { grid-column:2; grid-row:2; min-width:0; min-height:0; overflow:auto; padding:28px 32px; scrollbar-gutter:stable; }
h1 { font-size:27px; letter-spacing:-.04em; font-weight:650; }
h2 { font-size:20px; color:var(--fg); letter-spacing:-.025em; margin-bottom:10px; font-weight:600; }
p { line-height:1.65; }
.hint { line-height:1.55; font-size:12px; }
button { transition:background .12s,border-color .12s; }
button:hover:not(:disabled) { border-color:var(--idle); }
#view-panel>section,#view-panel>details { margin:14px 0; border:1px solid var(--line); border-radius:13px; background:var(--surface); padding:18px; }
#view-panel>header { padding:12px 0 12px 16px; margin-bottom:18px; }
#view-panel section h2 { font-size:13px; color:var(--muted); letter-spacing:.015em; font-weight:600; margin-bottom:14px; }
#reason { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
#input-sharing { font-size:11px; border-color:var(--line); color:var(--muted); }
#feedback:empty,#runtime-link-status:empty,#chat-status:empty,.hint:empty { display:none; }
dl { grid-template-columns:minmax(90px,.5fr) minmax(0,1fr); gap:10px 16px; font-size:12px; }
.switch { border-radius:9px; background:var(--bg); }
.switch button { padding:10px 6px; }
.switch button[aria-pressed="true"] { background:var(--idle); color:var(--surface); }
#pause { margin-left:auto; }
.technical-details>summary { cursor:pointer; font-size:13px; color:var(--muted); }
.technical-details section { margin-top:12px; }
main>#view-chat { display:flex; flex-direction:column; padding:0; overflow:hidden; gap:0; }
.view-heading { padding:24px 30px 16px; border-bottom:1px solid var(--line); background:var(--surface); }
.view-heading h2 { margin:0 0 4px; }
#chat { flex:1; min-height:0; overflow-y:auto; padding:20px 28px; margin:0; scrollbar-gutter:stable; }
#chat-older { padding:10px; text-align:center; background:var(--surface); }
.messages li { border:0; background:var(--surface); border-radius:13px; padding:15px 18px; margin-bottom:18px; max-width:96%; box-shadow:0 1px 0 var(--line); }
.messages li small { font-size:11px; color:var(--muted); display:block; margin-bottom:8px; }
.messages li[data-self="true"] { background:color-mix(in srgb,var(--idle) 10%,var(--surface)); max-width:85%; }
.messages p { line-height:1.7; margin:0; font-size:14px; }
#chat li[data-from="activity"] { background:transparent; border:0; border-radius:0; box-shadow:none; padding:4px 2px; margin:4px 0 12px; max-width:100%; color:var(--muted); }
#chat li[data-from="activity"] small { margin-bottom:3px; font-size:10px; opacity:.8; }
#chat li[data-from="activity"] p { font-size:13px; line-height:1.55; }
#chat-note { padding:0 28px; }
#chat-form { flex:none; background:var(--surface); border-top:1px solid var(--line); padding:16px 24px; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:12px; }
#chat-text { min-height:56px; max-height:160px; resize:vertical; border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:var(--bg); }
#chat-form button[type="submit"],#reply-form button[type="submit"] { background:var(--idle); color:var(--surface); border-color:var(--idle); border-radius:9px; padding:11px 18px; font-weight:600; }
#chat-status { grid-column:1/-1; overflow-wrap:anywhere; }
textarea:focus,select:focus { outline:2px solid color-mix(in srgb,var(--idle) 30%,transparent); outline-offset:2px; }
.runtime-links { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
.runtime-links>span { display:none; }
.runtime-links .link { border:1px solid var(--line); border-radius:8px; padding:7px 11px; background:var(--surface); font-size:12px; }
#wake-history-messages .wake-placeholder { color:var(--muted); box-shadow:none; background:transparent; }
#wake-history-messages { margin-top:20px; }
#wake-history-messages li>strong { color:var(--muted); font-size:11px; letter-spacing:.02em; display:block; margin-bottom:12px; font-weight:500; }
#wake-history-messages .wake-cue { font-size:22px; letter-spacing:-.035em; margin-bottom:12px; }
#wake-history-messages details { border-top:1px solid var(--line); padding-top:10px; }
summary { cursor:pointer; color:var(--muted); font-size:12px; padding:4px 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.65 Consolas,monospace; background:var(--bg); border-radius:8px; padding:14px; max-height:50vh; overflow:auto; }
.threads button { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:12px; }
.threads .thread-preview { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; font-size:13px; line-height:1.6; }
.repo-pointers { border:1px solid var(--line); border-radius:9px; padding:12px; margin:12px 0; }
#agent-thread-title,#thread-subject { margin-top:18px; }
.count { background:color-mix(in srgb,var(--idle) 14%,var(--surface)); color:var(--idle); }
@media(max-width:700px) {
 main { grid-template-columns:minmax(0,1fr); grid-template-rows:58px 52px minmax(0,1fr); }
 .app-brand { padding:0 18px; }
 .tabs { grid-row:2; grid-column:1; flex-direction:row; padding:6px 10px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); gap:2px; }
 .tabs button { white-space:nowrap; padding:8px 10px; font-size:12px; }
 main>[role="tabpanel"] { grid-column:1; grid-row:3; padding:20px 18px; }
 #chat { padding:16px; }
 .view-heading { padding:18px; }
 #chat-form { padding:12px 16px; }
 .messages li { padding:13px 14px; }
 .messages p { font-size:13px; }
 .app-status { max-width:130px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
}
@media(prefers-reduced-motion:reduce) { * { transition:none !important; } }
.app-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; }
.app-controls button { padding:7px 10px; font-size:12px; }
.message-markdown { min-width:0; overflow-wrap:anywhere; }
.message-markdown h3 { font-size:15px; margin:16px 0 8px; }
.message-markdown ul, .message-markdown ol { margin:8px 0; padding-left:24px; }
.messages .message-markdown li { border:0; background:none; box-shadow:none; padding:0; margin:5px 0; max-width:100%; white-space:pre-wrap; }
.message-markdown blockquote { margin:10px 0; padding-left:12px; border-left:3px solid var(--line); white-space:pre-wrap; }
.markdown-table { overflow-x:auto; margin:12px 0; }
.markdown-table table { border-collapse:collapse; width:100%; font-size:12px; }
