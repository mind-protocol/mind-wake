<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="Parler à Wake">Parler à Wake</title>
    <link rel="stylesheet" href="quick-input.css" />
    <script defer src="quick-input-close.js"></script>
  </head>
  <body>
    <form id="quick-form">
      <header data-tauri-drag-region title="Glisser pour déplacer le menu" data-i18n-title="Glisser pour déplacer le menu">
        <div class="identity"><strong data-tauri-drag-region>MIND <span aria-hidden="true" data-tauri-drag-region>⠿</span></strong>
        <button id="talk" type="button" data-i18n="Parler à mon agent">Parler à mon agent</button></div>
        <button id="cancel" type="button" aria-label="Fermer" title="Fermer (Échap)" data-i18n-aria-label="Fermer" data-i18n-title="Fermer (Échap)">×</button>
      </header>
      <div class="field-heading"><label for="message" data-i18n="Votre message">Votre message</label><small id="message-count">0 / 4 000</small></div>
      <textarea
        id="message"
        maxlength="4000"
        placeholder="Que veux-tu lui dire ?"
        data-i18n-placeholder="Que veux-tu lui dire ?"
        aria-describedby="capture-note status"
        required
      ></textarea>
      <small id="capture-note"><span aria-hidden="true">◎</span> <span data-i18n="Écran principal joint, point du clic cerclé.">Écran principal joint, point du clic cerclé.</span></small>
      <footer><button id="bumpe" type="button" disabled title="Inviter ton agent à une relance à partir du point cerclé" data-i18n-title="Inviter ton agent à une relance à partir du point cerclé">Bumpe</button>
        <button id="send" type="submit" disabled data-i18n="Envoyer">Envoyer</button></footer>
      <p id="status" role="status" aria-live="polite" data-i18n="Entrée : envoyer · Maj+Entrée : nouvelle ligne · Échap : fermer">
        Entrée : envoyer · Maj+Entrée : nouvelle ligne · Échap : fermer
      </p>
    </form>
    <script type="module" src="build/i18n-dom.js"></script>
    <script type="module" src="build/quick-input.js"></script>
  </body>
</html>
